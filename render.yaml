services:
  - type: web
    name: zach-db
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Dossier lu par l'API quand on passe ?dir=/... (facultatif).
      # Montez un disque Render et pointez cette variable dessus, sinon laissez vide.
      - key: ZACH_DB_DIR
        sync: false
      # Jeton bot Discord, pour l'outil « Discord lookup » (facultatif).
      # discord.com/developers/applications → Bot → Reset token.
      # Il reste sur le serveur : le navigateur ne reçoit jamais que le résultat.
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_CAP
        value: "40"
      - key: DISCORD_RATE_MAX
        value: "30"
      # Guns.lol views : aucun jeton. Le serveur récolte des proxys publics,
      # les trie par un vrai tunnel + TLS, puis envoie une vue par adresse.
      - key: GUNS_VIEWS
        value: "15"
      - key: GUNS_ROUNDS
        value: "1"
      - key: GUNS_PROXIES
        value: "6000"
      - key: GUNS_CONCURRENCY
        value: "6"
      - key: GUNS_TIMEOUT_MS
        value: "8000"
      - key: GUNS_BUDGET_MS
        value: "60000"
      - key: GUNS_RATE_MAX
        value: "6"
      - key: GUNS_VALIDATE_CONCURRENCY
        value: "120"
      - key: GUNS_VALIDATE_TIMEOUT_MS
        value: "5000"
      - key: GUNS_VALIDATE_MAX
        value: "0"
      - key: GUNS_PROXY_PER_SOURCE
        value: "1500"
